
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: .NET 9 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Go einrichten
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: ogamed/go.sum

      - name: Go-Abhängigkeiten herunterladen
        shell: bash
        run: |
          set -euo pipefail
          cd ogamed

          for attempt in 1 2 3; do
            echo "Go dependency download: Versuch ${attempt}/3"

            if GOPROXY=https://proxy.golang.org go mod download; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done

          echo "::error::Go-Abhängigkeiten konnten nicht geladen werden."
          exit 1

      - name: Pakete bauen (mit Wiederholungen)
        shell: bash
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
          TBOT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          set -euo pipefail
          chmod +x tools/*.sh
          mkdir -p dist

          retry_build() {
            local attempt
            for attempt in 1 2 3; do
              echo "Starte: $* (Versuch ${attempt}/3)"

              if "$@"; then
                return 0
              fi

              if [ "$attempt" -lt 3 ]; then
                echo "::warning::Build fehlgeschlagen. Neuer Versuch in $((attempt * 15)) Sekunden."
                sleep $((attempt * 15))
              fi
            done

            echo "::error::Build endgültig fehlgeschlagen: $*"
            return 1
          }

          retry_build tools/build-windows.sh
          retry_build tools/build-linux.sh
          retry_build tools/build-linux.sh --arm64

      - name: Release-Dateien validieren
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "dist/TBot-win-x64.zip"
            "dist/TBot-linux-x64.zip"
            "dist/TBot-linux-arm64.zip"
          )

          for file in "${required[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::Paket fehlt oder ist leer: $file"
              exit 1
            fi

            unzip -t "$file"
            echo "OK: $file ($(stat -c '%s' "$file") Bytes)"
          done

          echo "Alle drei Pakete sind vorhanden und lesbar."

      - name: SHA-256-Prüfsummen erstellen
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            TBot-win-x64.zip \
            TBot-linux-x64.zip \
            TBot-linux-arm64.zip \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: tbot-release-packages
          path: |
            dist/TBot-win-x64.zip
            dist/TBot-linux-x64.zip
            dist/TBot-linux-arm64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: GitHub-Release aktualisieren
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/TBot-win-x64.zip
            dist/TBot-linux-x64.zip
            dist/TBot-linux-arm64.zip
            dist/SHA256SUMS.txt
