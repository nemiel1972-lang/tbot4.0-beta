# Baut beim Anlegen eines Tags (z. B. v4.0-beta1) die Pakete und haengt sie an ein GitHub-Release.
# Start auch manuell moeglich: Actions -> Release -> Run workflow (dann nur Build, kein Release).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Pakete bauen
        run: |
          chmod +x tools/*.sh
          tools/build-windows.sh
          tools/build-linux.sh
          tools/build-linux.sh --arm64
          ls -la dist

      - name: Artefakte hochladen (Build-Lauf)
        uses: actions/upload-artifact@v4
        with:
          name: pakete
          path: |
            dist/*.zip
            dist/*.tar.gz

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
