# Baut beim Anlegen eines Tags (z. B. v4.0-beta1) die Pakete und haengt sie an ein GitHub-Release.
# Start auch manuell moeglich: Actions -> Release -> Run workflow (dann nur Build, kein Release).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Pakete bauen
        env:
          # ImageSharp 4.x prueft den Lizenzschluessel beim Build (Repo-Secret SIXLABORS_LICENSE_KEY)
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
          # Versionsname fuer die Update-Pruefung im WebUI (version.txt im Paket)
          TBOT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          chmod +x tools/*.sh
          tools/build-windows.sh
          tools/build-linux.sh
          tools/build-linux.sh --arm64
          ls -la dist

      - name: Pruefsummen
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Artefakte hochladen (Build-Lauf)
        uses: actions/upload-artifact@v4
        with:
          name: pakete
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: false
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
